# AppProject for Argo CD's own declarations (Chapter 14, app of apps).
# The root Application may create AppProjects and Applications in argocd —
# nothing else: no cluster-scoped kinds, no workloads, no Secrets, no RBAC.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Argo CD's own AppProjects and Applications from beamline-k8s argocd/ (Chapter 14)
  sourceRepos:
    - https://gitlab.beamline/beamline/beamline-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
