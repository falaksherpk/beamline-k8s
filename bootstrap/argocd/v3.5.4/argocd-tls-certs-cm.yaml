# Lab CA for Argo CD's repo-server (Chapter 14).
# Key = the host in the repository URL (https://gitlab.beamline/...); value = the CA
# that signed gitlab.beamline's certificate, not the leaf, so a server-certificate
# renewal doesn't break the repo connection. Public certificate only.
# Applied server-side with --field-manager=beamline-lab, so only data."gitlab.beamline"
# is ours; upstream install.yaml ships this ConfigMap with no data.
